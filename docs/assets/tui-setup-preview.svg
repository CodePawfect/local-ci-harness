<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Local CI Harness setup TUI preview</title>
  <desc id="desc">A terminal-style preview of the interactive project setup flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#e9eef5"/>
  <rect x="56" y="44" width="1168" height="632" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="56" y="44" width="1168" height="54" rx="18" fill="#182335"/>
  <rect x="56" y="80" width="1168" height="18" fill="#182335"/>
  <circle cx="89" cy="71" r="8" fill="#ff6b6b"/>
  <circle cx="116" cy="71" r="8" fill="#ffd166"/>
  <circle cx="143" cy="71" r="8" fill="#62d68d"/>
  <text x="184" y="77" fill="#8da2bd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">local-ci-harness  ·  setup</text>

  <text x="104" y="151" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="700">Local CI Harness</text>
  <text x="104" y="181" fill="#91a4be" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Projektprofil für /repos/seo-orbiter</text>

  <rect x="96" y="213" width="1088" height="1" fill="#26364e"/>
  <text x="104" y="255" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">CI-Stages auswählen</text>
  <text x="104" y="283" fill="#7186a2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">↑↓ bewegen · Leertaste auswählen · Enter bestätigen</text>

  <rect x="104" y="319" width="520" height="45" rx="7" fill="#1d4ed8" fill-opacity=".28" stroke="#5b8cff" stroke-opacity=".75"/>
  <text x="126" y="348" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">[x] secrets</text>
  <text x="126" y="398" fill="#d2dbea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">[x] static-analysis</text>
  <text x="126" y="448" fill="#d2dbea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">[x] dependencies</text>
  <text x="126" y="498" fill="#d2dbea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">[x] tests</text>
  <text x="126" y="548" fill="#d2dbea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">[x] coverage</text>
  <text x="126" y="598" fill="#d2dbea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">[x] build</text>

  <rect x="713" y="319" width="427" height="277" rx="12" fill="#111c2d" stroke="#2a3b55"/>
  <text x="744" y="360" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">DETECTED</text>
  <text x="744" y="393" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Next.js Fullstack</text>
  <text x="744" y="438" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">TARGET BRANCH</text>
  <text x="744" y="471" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">main</text>
  <text x="744" y="516" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">OUTPUT</text>
  <text x="744" y="549" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">.ci/harness.json</text>
  <text x="744" y="578" fill="#91a4be" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">+ .ci/agent-prompt.md</text>
</svg>
