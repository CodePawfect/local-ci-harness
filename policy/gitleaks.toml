title = "Local CI: built-in detection rules; no per-project suppressions"
[extend]
useDefault = true
# Ignore rules live centrally; evidence and owner-authorized review follow AGENTS.md.
# Generated dependencies never enter the source snapshot.
[[allowlists]]
description = "Git internals are scanned separately with gitleaks git"
paths = ['''(^|/)\.git/''']

[[allowlists]]
description = "Verified PhysioPose legacy LocalStorage name; exact literal only"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''(^|/)src/ga4Runtime\.ts$''']
regexes = ['''^physiopose-ga4-consent$''']
